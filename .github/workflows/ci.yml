# CI Validation Workflow — mobile-app monorepo
#
# Two independent lanes run in parallel:
#   - backend: Express + TypeScript + Prisma (lint, typecheck, test, migrate check)
#   - app:     Flutter (analyze, format, test, build)
#
# Branch protection should require both "Backend" and "App" checks.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: app_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d app_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://app_user:app_password@localhost:5432/app_dev?schema=public"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint (RLS-enforcing ESLint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Migrate check (applies migrations to a fresh DB)
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  app:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Test
        run: flutter test

      - name: Generate platform folders
        # Source-only scaffold has no android/ios folders; create them for the
        # build. No-op once platform folders are committed.
        run: flutter create . --platforms=android --org live.tamasha

      - name: Build (debug APK)
        run: flutter build apk --debug
